<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF6EE;--latte:#E8D8C3;--mocha:#B89A7C;--brown:#4A3A2E;--sub:#8A7563;--mauve:#A65472;--gold1:#C9962E;--gold2:#F3D27A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--brown);
  background:
   radial-gradient(520px 520px at 88% 6%,rgba(255,226,170,.85),transparent 70%),
   radial-gradient(600px 600px at 0% 100%,rgba(255,214,160,.55),transparent 70%),
   linear-gradient(170deg,#EFE2D0 0%,#E3D0B8 55%,#D6BFA3 100%)}
.bokeh{position:absolute;border-radius:50%;background:rgba(255,244,220,.55);filter:blur(2px)}
.spark{position:absolute;color:#fff;text-shadow:0 0 18px rgba(255,236,190,.9)}
.head{position:absolute;left:0;right:0;top:150px;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:18px;font-family:"Cormorant Garamond";font-style:italic;font-size:44px;color:var(--sub);letter-spacing:.04em}
.eyebrow:before,.eyebrow:after{content:"";width:70px;height:2px;background:var(--mocha)}
h1{font-family:"Shippori Mincho B1";font-weight:800;font-size:116px;line-height:1.12;letter-spacing:.02em;margin-top:8px;color:var(--brown);
  text-shadow:0 2px 0 rgba(255,255,255,.6)}
h1 .g{background:linear-gradient(180deg,#E9BE55 0%,#C48E2C 55%,#8F5F1A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(255,255,255,.7))}
.tag{display:inline-block;margin-top:22px;background:#fff;border:4px solid #E7B7C5;color:var(--mauve);font-weight:900;font-size:42px;padding:10px 40px;border-radius:14px;box-shadow:0 8px 24px rgba(120,80,40,.18);transform:rotate(-1.5deg)}
.sheet{position:absolute;left:54px;right:54px;top:640px;background:rgba(255,252,247,.94);border-radius:44px;padding:30px 36px 24px;
  box-shadow:0 30px 60px rgba(110,75,40,.22),inset 0 0 0 2px rgba(255,255,255,.9)}
.sheet .cap{display:flex;justify-content:space-between;font-weight:700;font-size:26px;color:var(--sub);letter-spacing:.18em;padding:0 8px 14px;border-bottom:2px solid #EADFD2}
.row{display:flex;align-items:center;height:122px;padding:0 8px;border-bottom:2px dashed #EADFD2}
.row:last-child{border-bottom:none}
.num{font-family:"Cormorant Garamond";font-style:italic;font-size:54px;color:var(--mocha);width:58px}
.task{flex:1;min-width:0}
.task b{display:block;font-weight:900;font-size:44px;line-height:1.2;letter-spacing:.01em}
.task small{display:block;font-weight:500;font-size:24px;color:var(--sub);margin-top:4px;white-space:nowrap}
.tool{display:flex;align-items:center;gap:18px;width:380px}
.ico{width:88px;height:88px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 6px 18px rgba(110,75,40,.18),0 0 0 2px #F1E8DC}
.ico img{width:60px;height:60px}
.ico.full{background:none;overflow:hidden}.ico.full img{width:88px;height:88px}
.ico.tbd{background:#F3ECE3;border:3px dashed var(--mocha);box-shadow:none;font:900 40px "Zen Kaku Gothic New";color:var(--mocha)}
.ico .gm{font:900 19px/1 "Zen Kaku Gothic New";letter-spacing:.06em;color:#3A47D5}
.name{font-weight:900;font-size:38px;line-height:1.1;letter-spacing:-.01em}
.name small{display:block;font-weight:500;font-size:22px;color:var(--sub);margin-top:4px}
.foot{position:absolute;left:0;right:0;top:1770px;text-align:center;font-family:"Shippori Mincho B1";font-weight:600;font-size:34px;color:var(--brown);letter-spacing:.12em}
</style></head><body>
<div class="bokeh" style="width:180px;height:180px;left:-40px;top:420px"></div>
<div class="bokeh" style="width:90px;height:90px;right:60px;top:560px;opacity:.7"></div>
<div class="bokeh" style="width:140px;height:140px;right:-30px;top:1650px"></div>
<div class="spark" style="left:120px;top:150px;font-size:48px">✦</div>
<div class="spark" style="right:110px;top:300px;font-size:36px">✦</div>
<div class="spark" style="left:70px;top:520px;font-size:30px">✦</div>

<div class="head">
  <div class="eyebrow">AI cheat sheet</div>
  <h1>作業別<br><span class="g">AI使い分け</span></h1>
  <div class="tag">保存版 ｜ 全8選</div>
</div>

<div class="sheet">
  <div class="cap"><span>やりたいこと</span><span style="width:380px">使うAI</span></div>
  <div id="rows"></div>
</div>
<div class="foot">― 保存して、使うときに見返してね ―</div>

<script>
// ★ [作業, ひとこと, AI名, AIの補足, アイコン]  アイコン: 'icons/xxx.svg' / 'GAMMA'(文字) / '?'(未確定)
const ROWS = [
  ["とりあえず聞きたい", "", "ChatGPT",     "チャットジーピーティー", "icons/chatgpt.svg"],
  ["会議の文字起こし",   "", "Notta",       "ノッタ",                 "icons/notta.svg"],
  ["長い資料の要約",     "", "NotebookLM",  "ノートブックエルエム",   "icons/notebooklm.svg"],
  ["メールの文章",       "", "Claude",      "クロード",               "icons/claude.svg"],
  ["文章を図に",         "", "Napkin AI",   "ナプキンエーアイ",       "icons/napkin.svg"],
  ["スライド作り",       "", "Gamma",       "ガンマ",                 "icons/gamma.svg"],
  ["写真の背景チェンジ", "", "Nano Banana", "ナノバナナ",             "icons/nanobanana.svg"],
  ["動画作り",           "", "MUSE",        "ミューズ",               "icons/muse.svg"],
];
const ico = s => s==='?' ? '<div class="ico tbd">?</div>' : s==='GAMMA' ? '<div class="ico"><span class="gm">GAMMA</span></div>' : (/notta|napkin/.test(s)?`<div class="ico full"><img src="${s}"></div>`:/gamma/.test(s)?`<div class="ico"><img src="${s}" style="width:84px;height:84px"></div>`:`<div class="ico"><img src="${s}"></div>`);
document.getElementById('rows').innerHTML = ROWS.map((r,i)=>`
  <div class="row"><span class="num">${String(i+1).padStart(2,'0')}</span>
   <div class="task"><b>${r[0]}</b>${r[1]?`<small>${r[1]}</small>`:''}</div>
   <div class="tool">${ico(r[4])}<div class="name">${r[2]}${r[3]?`<small>${r[3]}</small>`:''}</div></div></div>`).join('');
</script>
</body></html>
